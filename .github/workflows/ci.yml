name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Validate radar seed registry
        run: npm run validate:registry

      - name: Run test suite
        run: npm test

  action-smoke:
    name: GitHub Action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create a sample contract
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          printf '# Smoke\n\n## Contract: Action smoke\n- REQ-1 Node runs.\n  Check: `node --version`\n' > "$RUNNER_TEMP/smoke/SPEC.md"

      - name: Run the action from this repository
        id: verify
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/smoke
          post-pr-comment: "false"

      - name: Check the action output
        run: test "${{ steps.verify.outputs.status }}" = "verified"
